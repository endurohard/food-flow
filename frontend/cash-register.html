<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#49B20D">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Касса — FoodFlow</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <script src="/js/auth.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--admin-content-bg, #f6f7f9);
      color: var(--color-text-primary, #1d2129);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Экраны ── */
    .screen { display: none; height: 100%; }
    .screen.active { display: flex; }
    .center { align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }

    .card {
      background: var(--admin-panel-bg, #fff);
      border: 1px solid var(--admin-panel-border, #e3e5e8);
      border-radius: 14px;
      padding: 28px 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    h2 { font-size: 18px; margin: 0 0 6px; }
    .muted { color: var(--color-text-secondary, #6b7280); font-size: 14px; margin: 0 0 18px; line-height: 1.45; }
    .label { display: block; font-size: 13px; font-weight: 500; color: var(--color-text-secondary, #6b7280); margin: 12px 0 6px; }

    input {
      width: 100%;
      padding: 14px 12px;
      font-size: 17px;
      border: 1px solid var(--admin-panel-border, #d6d9de);
      border-radius: 10px;
      background: #fff;
      color: inherit;
      outline: none;
    }
    input:focus { border-color: var(--color-primary, #1f8f5f); }

    button {
      appearance: none; border: none; cursor: pointer; font-family: inherit; font-weight: 600;
      border-radius: 10px; transition: background .15s, transform .05s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--color-primary, #1f8f5f); color: #fff; width: 100%; padding: 16px; font-size: 18px; margin-top: 16px; }
    .btn-secondary { background: #fff; color: inherit; border: 1px solid var(--admin-panel-border, #d6d9de); padding: 10px 14px; font-size: 15px; }
    .btn-danger { background: #fff; color: #c0392b; border: 1px solid #e2a29b; padding: 10px 14px; font-size: 15px; }

    .error { color: #c0392b; font-size: 14px; min-height: 18px; margin: 10px 0 0; }
    .ok-msg { color: #1b5e20; background: #e8f5e9; border-radius: 10px; padding: 12px; text-align: center; font-size: 15px; margin-top: 10px; }

    /* ── Выбор кассы ── */
    .choice-list { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px; border: 1px solid var(--admin-panel-border, #d6d9de); border-radius: 10px;
      background: #fff; font-size: 16px; text-align: left; width: 100%;
    }
    .badge { font-size: 12px; padding: 3px 8px; border-radius: 99px; font-weight: 600; }
    .badge.open { background: #e8f5e9; color: #1b5e20; }
    .badge.closed { background: #f1f2f4; color: #6b7280; }

    /* ── PIN-клавиатура ── */
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 18px 0 8px; }
    .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-primary, #1f8f5f); }
    .pin-dots span.filled { background: var(--color-primary, #1f8f5f); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .keypad button { padding: 18px 0; font-size: 24px; background: #f4f5f7; color: inherit; }
    .keypad button.wide { font-size: 16px; }
    .rc-row .it { min-width: 0; }

    /* ── Продажи ── */
    #till-screen { flex-direction: column; }
    .till-header {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 14px; background: var(--admin-panel-bg, #fff);
      border-bottom: 1px solid var(--admin-panel-border, #e3e5e8);
    }
    .till-header .title { font-weight: 700; font-size: 17px; flex: 1; min-width: 160px; }
    .till-header .title small { display: block; font-weight: 400; font-size: 13px; color: var(--color-text-secondary, #6b7280); }
    .till-main { flex: 1; display: flex; min-height: 0; }
    .menu-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .cats { display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; flex-shrink: 0; }
    .cats button { padding: 10px 14px; background: #fff; border: 1px solid var(--admin-panel-border, #d6d9de); font-size: 15px; white-space: nowrap; color: inherit; }
    .cats button.active { background: var(--color-primary, #1f8f5f); color: #fff; border-color: var(--color-primary, #1f8f5f); }
    .grid {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 14px 14px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start;
    }
    .tile {
      background: #fff; border: 1px solid var(--admin-panel-border, #e3e5e8); border-radius: 12px;
      padding: 14px 12px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between;
      text-align: left; font-size: 15px; color: inherit; position: relative;
    }
    .tile .price { color: var(--color-text-secondary, #6b7280); font-weight: 500; margin-top: 8px; }
    .tile .qty-badge { position: absolute; top: 8px; right: 8px; background: var(--color-primary, #1f8f5f); color: #fff; border-radius: 99px; font-size: 13px; padding: 2px 8px; }

    .cart-col {
      width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--admin-panel-bg, #fff); border-left: 1px solid var(--admin-panel-border, #e3e5e8);
    }
    .cart-list { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .cart-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f1f3; font-size: 15px; }
    .cart-row .n { flex: 1; }
    .cart-row button { width: 34px; height: 34px; background: #f4f5f7; font-size: 18px; color: inherit; }
    .cart-row .sum { min-width: 70px; text-align: right; }
    .cart-foot { padding: 12px 14px; border-top: 1px solid var(--admin-panel-border, #e3e5e8); }
    .total { display: flex; justify-content: space-between; font-size: 22px; font-weight: 700; }
    .pay { display: flex; gap: 10px; margin-top: 12px; }
    .pay button { flex: 1; padding: 14px; font-size: 16px; background: #fff; border: 1px solid var(--admin-panel-border, #d6d9de); color: inherit; }
    .pay button.active { background: var(--color-primary, #1f8f5f); color: #fff; border-color: var(--color-primary, #1f8f5f); }

    .hold-row { display: flex; gap: 8px; margin-top: 10px; }
    .hold-row input { flex: 1; padding: 10px; font-size: 15px; }
    .checks-panel { position: absolute; inset: 58px 0 0 0; background: var(--admin-content-bg, #f6f7f9); z-index: 5; display: flex; flex-direction: column; padding: 14px; overflow-y: auto; }
    .checks-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .checks-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .check-card { background: #fff; border: 1px solid var(--admin-panel-border, #e3e5e8); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
    .check-card .t { font-weight: 700; font-size: 16px; }
    .check-card .m { color: var(--color-text-secondary, #6b7280); font-size: 13px; }
    .check-card .acts { display: flex; gap: 8px; margin-top: 6px; }
    .check-card .acts button { flex: 1; padding: 10px; font-size: 15px; }
    #till-screen { position: relative; }

    /* ── Чеки смены: просмотр, возврат, смена оплаты ── */
    .rc-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .rc-tools input { width: auto; flex: 1; min-width: 140px; padding: 10px 12px; font-size: 15px; }
    .rc-list { display: flex; flex-direction: column; gap: 8px; }
    .rc-row { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--admin-panel-border, #e3e5e8);
              border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%; font-size: 15px; color: inherit; }
    .rc-row .no { font-weight: 700; min-width: 120px; }
    .rc-row .tm { color: var(--color-text-secondary, #6b7280); min-width: 50px; }
    .rc-row .it { flex: 1; color: var(--color-text-secondary, #6b7280); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-row .sm { font-weight: 700; min-width: 90px; text-align: right; }
    .tag { font-size: 12px; padding: 3px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
    /* не .card: этот класс уже занят карточками экранов (белый блок с тенью) */
    .tag.t-cash { background: #e8f5e9; color: #1b5e20; } .tag.t-card { background: #e3f2fd; color: #0d47a1; }
    .tag.ref { background: #fdecea; color: #b71c1c; } .tag.part { background: #fff4e5; color: #8a5300; }
    .rc-detail { background: #fff; border: 1px solid var(--admin-panel-border, #e3e5e8); border-radius: 14px; padding: 16px; max-width: 720px; }
    .rc-line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f1f3; font-size: 15px; }
    .rc-line .n { flex: 1; }
    .rc-line .n small { display: block; color: var(--color-text-secondary, #6b7280); font-size: 13px; }
    .rc-line .stp { display: flex; align-items: center; gap: 6px; }
    .rc-line .stp button { width: 36px; height: 36px; background: #f4f5f7; font-size: 18px; color: inherit; }
    .rc-line .stp span { min-width: 22px; text-align: center; font-weight: 700; }
    .rc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .rc-actions button { padding: 12px 14px; font-size: 15px; }
    .rc-hist { margin-top: 12px; font-size: 13px; color: var(--color-text-secondary, #6b7280); }
    .approve-box { margin-top: 16px; border: 2px solid var(--color-primary, #1f8f5f); border-radius: 14px; padding: 16px; max-width: 360px; }
    .approve-box h3 { margin: 0 0 4px; font-size: 17px; }

    @media (max-width: 760px) {
      .till-main { flex-direction: column; }
      .cart-col { width: 100%; max-height: 45%; border-left: none; border-top: 1px solid var(--admin-panel-border, #e3e5e8); }
    }
  </style>
</head>
<body>
  <!-- 0. Привязка планшета (один раз, владельцем) -->
  <div id="activate-screen" class="screen center">
    <div class="card">
      <h1>Привязка планшета к кассе</h1>
      <p class="muted">Один раз: войдите владельцем или админом и выберите кассу. Дальше кассиры входят на этом планшете только PIN-ом.</p>
      <form id="activate-form" autocomplete="off">
        <label class="label" for="act-email">Логин владельца (email или логин на адресе организации)</label>
        <input id="act-email" type="text" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="username" required>
        <label class="label" for="act-password">Пароль</label>
        <input id="act-password" type="password" autocomplete="current-password" required>
        <button class="btn-primary" type="submit" id="btn-activate">Войти</button>
      </form>
      <div class="choice-list" id="act-registers" style="margin-top:14px"></div>
      <p class="error" id="act-error"></p>
    </div>
  </div>

  <!-- 1. PIN -->
  <div id="pin-screen" class="screen center">
    <div class="card" style="max-width:380px">
      <h2 id="pin-title">Введите PIN кассира</h2>
      <p class="muted" id="pin-hint"></p>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="keypad" id="keypad"></div>
      <p class="error" id="pin-error"></p>
    </div>
  </div>

  <!-- 2. Открытие смены -->
  <div id="setup-screen" class="screen center">
    <div class="card">
      <h1 id="setup-title">Смена закрыта</h1>
      <p class="muted">Пересчитайте наличные в кассе и откройте смену.</p>
      <label class="label" for="opening-balance">Наличные в кассе на начало смены, ₽</label>
      <input id="opening-balance" type="number" inputmode="decimal" min="0" step="0.01" value="0">
      <button class="btn-primary" id="btn-open-shift">Открыть смену</button>
      <p class="error" id="setup-error"></p>
      <button class="btn-secondary" style="margin-top:14px" id="btn-setup-back">Назад к PIN</button>
    </div>
  </div>

  <!-- 3. Продажи -->
  <div id="till-screen" class="screen">
    <div class="till-header">
      <div class="title"><span id="till-register">Касса</span><small id="till-sub"></small></div>
      <button class="btn-secondary" id="btn-checks">🧾 Отложенные <span id="checks-count" class="badge open">0</span></button>
      <button class="btn-secondary" id="btn-receipts">📜 Чеки смены</button>
      <button class="btn-secondary" id="btn-lock">🔒 Заблокировать / сменить кассира</button>
      <button class="btn-danger" id="btn-close-shift">Закрыть смену</button>
    </div>
    <!-- Отложенные чеки -->
    <div id="checks-panel" class="checks-panel" style="display:none">
      <div class="checks-head">
        <h2 style="margin:0">Отложенные чеки</h2>
        <button class="btn-secondary" id="btn-checks-close">Закрыть</button>
      </div>
      <div id="checks-list" class="checks-list"></div>
      <p class="error" id="checks-error"></p>
    </div>
    <!-- Пробитые чеки: просмотр, возврат, смена оплаты (PIN администратора) -->
    <div id="receipts-panel" class="checks-panel" style="display:none">
      <div class="checks-head">
        <h2 style="margin:0" id="rc-title">Чеки за сегодня</h2>
        <button class="btn-secondary" id="btn-receipts-close">Закрыть</button>
      </div>
      <div id="rc-list-view">
        <div class="rc-tools">
          <input id="rc-search" type="text" inputmode="search" placeholder="Номер чека, например 9E0C4F">
          <input id="rc-date" type="date" style="flex:0 0 auto">
          <button class="btn-secondary" id="btn-rc-refresh">Обновить</button>
        </div>
        <div id="rc-list" class="rc-list"></div>
      </div>
      <div id="rc-detail-view" style="display:none">
        <button class="btn-secondary" id="btn-rc-back" style="margin-bottom:12px">← Все чеки</button>
        <div class="rc-detail" id="rc-detail"></div>
      </div>
      <p class="error" id="rc-error"></p>
      <div id="rc-ok"></div>
    </div>
    <div class="till-main">
      <div class="menu-col">
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"><p class="muted">Загрузка меню…</p></div>
      </div>
      <div class="cart-col">
        <div class="cart-list" id="cart"></div>
        <div class="cart-foot">
          <div class="total"><span>Итого</span><span id="total">0 ₽</span></div>
          <div class="pay" id="pay">
            <button data-method="cash" class="active">Наличные</button>
            <button data-method="card">Картой</button>
          </div>
          <div id="check-current" class="muted" style="margin:10px 0 0;display:none"></div>
          <div class="hold-row">
            <input id="check-label" type="text" maxlength="100" placeholder="Подпись: столик, имя…">
            <button class="btn-secondary" id="btn-hold">Отложить</button>
          </div>
          <button class="btn-primary" id="btn-checkout">Оплатить</button>
          <p class="error" id="till-error"></p>
          <div id="till-ok"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/cash-register.js"></script>
</body>
</html>
