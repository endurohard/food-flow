<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Flow — Статус оплаты</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-family);
      background: var(--customer-bg-subtle);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--customer-bg);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: var(--shadow-modal);
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    .title { font-family: var(--font-family-heading); font-size: var(--font-size-xl); font-weight: 700; margin-bottom: 12px; }
    .message { font-size: var(--font-size-base); color: var(--color-text-secondary); margin-bottom: 8px; line-height: var(--line-height-normal); }
    .order-id { font-size: var(--font-size-md); color: var(--color-text-secondary); margin-bottom: 32px; }
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: var(--radius-xl);
      font-size: var(--font-size-md);
      font-weight: 600;
      margin-bottom: 32px;
    }
    .status-badge.checking  { background: var(--color-warning-light); color: #6B5410; }
    .status-badge.succeeded { background: var(--color-success-light); color: var(--color-primary-hover); }
    .status-badge.pending   { background: var(--color-info-light);    color: #6B5410; }
    .status-badge.canceled  { background: var(--color-danger-light);  color: #9A3520; }
    .btn {
      display: inline-block;
      min-height: 48px;
      padding: 14px 32px;
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border: none;
      border-radius: var(--radius-lg);
      font-family: inherit;
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition-base);
    }
    .btn:hover { background: var(--color-primary-hover); }
    .btn-secondary {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 24px;
      background: transparent;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-lg);
      font-family: inherit;
      font-size: var(--font-size-md);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition-base);
    }
    .btn-secondary:hover { background: var(--color-primary-light); }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--color-grey-3);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <div class="title" id="title">Проверяем оплату...</div>
    <div class="message" id="message">Пожалуйста, подождите</div>
    <div class="order-id" id="orderId"></div>
    <div class="status-badge checking" id="statusBadge">Проверка</div>
    <br>
    <a href="index.html" class="btn" id="backBtn" style="display:none">Вернуться в меню</a>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api';
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const paymentId = params.get('paymentId'); // YooKassa may pass this

    if (orderId) {
      document.getElementById('orderId').textContent = `Заказ: ${orderId}`;
    }

    async function checkPaymentStatus() {
      if (!orderId) {
        showResult('unknown');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/finance/payments?orderId=${orderId}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const payments = data.payments || [];
        const payment = payments.find(p => p.payment_gateway === 'yookassa') || payments[0];

        if (!payment) {
          // No payment record yet — might still be processing
          setTimeout(checkPaymentStatus, 3000);
          return;
        }
        showResult(payment.status);
      } catch {
        showResult('unknown');
      }
    }

    function showResult(status) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('backBtn').style.display = 'inline-block';
      const badge = document.getElementById('statusBadge');

      if (status === 'completed') {
        document.getElementById('title').textContent = 'Оплата прошла!';
        document.getElementById('message').textContent = 'Ваш заказ принят и передан на кухню. Ожидайте доставку.';
        badge.className = 'status-badge succeeded';
        badge.textContent = 'Оплачено';
      } else if (status === 'pending') {
        document.getElementById('title').textContent = 'Оплата обрабатывается';
        document.getElementById('message').textContent = 'Платёж находится в обработке. Мы уведомим вас о результате.';
        badge.className = 'status-badge pending';
        badge.textContent = 'В обработке';
        // Retry after 5s
        setTimeout(checkPaymentStatus, 5000);
        return;
      } else if (status === 'failed' || status === 'refunded') {
        document.getElementById('title').textContent = 'Оплата не прошла';
        document.getElementById('message').textContent = 'К сожалению, платёж был отклонён. Попробуйте ещё раз или выберите другой способ оплаты.';
        badge.className = 'status-badge canceled';
        badge.textContent = 'Отклонено';
      } else {
        document.getElementById('title').textContent = 'Заказ оформлен';
        document.getElementById('message').textContent = 'Статус оплаты уточняется. Мы свяжемся с вами при необходимости.';
        badge.className = 'status-badge checking';
        badge.textContent = 'Уточняется';
      }
    }

    checkPaymentStatus();
  </script>
</body>
</html>
