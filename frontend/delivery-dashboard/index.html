<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление Доставками - Food Flow</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--admin-content-bg);
      color: var(--color-text-primary);
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Левая панель - Список доставок */
    .deliveries-list {
      width: 420px;
      background: var(--admin-card-bg);
      border-right: 1px solid var(--admin-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      background: var(--color-primary);
      color: var(--color-text-inverse);
    }

    .header h1 {
      font-family: var(--font-family-heading);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header .subtitle {
      font-size: 13px;
      opacity: 0.9;
    }

    .filters {
      padding: 12px;
      background: var(--admin-content-bg);
      border-bottom: 1px solid var(--admin-border);
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .filter-tab {
      flex: 1;
      padding: 7px 10px;
      background: var(--admin-card-bg);
      border: 1px solid var(--admin-border);
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      transition: all 0.2s;
    }

    .filter-tab.active {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border-color: var(--color-primary);
    }

    .filter-tab:hover:not(.active) {
      background: var(--admin-content-bg);
    }

    .search-box {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--admin-border);
      border-radius: 4px;
      font-size: 13px;
    }

    .delivery-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .delivery-card {
      background: var(--admin-card-bg);
      border: 2px solid var(--admin-border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delivery-card:hover {
      border-color: var(--color-primary);
      box-shadow: 0 2px 8px rgba(46, 125, 79, 0.2);
    }

    .delivery-card.selected {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
    }

    .delivery-card.new {
      border-left: 4px solid var(--color-warning);
    }

    .delivery-card.assigned {
      border-left: 4px solid var(--color-primary);
    }

    .delivery-card.in_transit {
      border-left: 4px solid var(--color-text-primary);
    }

    .delivery-card.delivered {
      border-left: 4px solid var(--color-success);
    }

    .delivery-card.cancelled {
      border-left: 4px solid var(--color-danger);
      opacity: 0.6;
    }

    .delivery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .delivery-id {
      font-weight: 600;
      font-size: 14px;
      color: var(--color-primary);
    }

    .delivery-time {
      font-size: 11px;
      color: var(--color-text-secondary);
    }

    .delivery-status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .status-new { background: var(--color-warning-light); color: #6B5410; }
    .status-assigned { background: var(--color-primary-light); color: #1F5A38; }
    .status-in_transit { background: var(--admin-sidebar-border); color: var(--color-text-primary); }
    .status-delivered { background: var(--color-success-light); color: #1F5A38; }
    .status-cancelled { background: var(--color-danger-light); color: #9A3520; }

    .delivery-address {
      font-size: 12px;
      color: var(--color-text-primary);
      margin-bottom: 4px;
      display: flex;
      align-items: flex-start;
      gap: 4px;
      line-height: 1.4;
    }

    .delivery-customer {
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    /* Правая панель - Детали доставки */
    .delivery-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .details-header {
      padding: 16px 20px;
      background: var(--admin-card-bg);
      border-bottom: 1px solid var(--admin-border);
    }

    .details-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--color-text-primary);
    }

    .status-timeline {
      display: flex;
      gap: 15px;
      padding: 16px 20px;
      background: var(--admin-card-bg);
      border-bottom: 1px solid var(--admin-border);
    }

    .timeline-step {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .timeline-step::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--admin-border);
      z-index: 0;
    }

    .timeline-step:last-child::after {
      display: none;
    }

    .timeline-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--admin-border);
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      font-size: 14px;
    }

    .timeline-step.completed .timeline-icon {
      background: var(--color-success);
      color: var(--color-text-inverse);
    }

    .timeline-step.active .timeline-icon {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      animation: pulse 2s infinite;
    }

    .timeline-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      font-weight: 500;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46, 125, 79, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(46, 125, 79, 0); }
    }

    .details-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .section {
      background: var(--admin-card-bg);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--admin-content-bg);
      gap: 12px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .info-value {
      font-size: 13px;
      color: var(--color-text-primary);
      font-weight: 500;
      text-align: right;
    }

    .order-items {
      margin-top: 8px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--admin-content-bg);
      border-radius: 4px;
      margin-bottom: 6px;
      align-items: center;
    }

    .item-name {
      font-size: 13px;
      color: var(--color-text-primary);
    }

    .item-quantity {
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    .item-price {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .actions {
      padding: 16px;
      background: var(--admin-card-bg);
      border-top: 1px solid var(--admin-border);
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--color-primary);
      color: var(--color-text-inverse);
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(46, 125, 79, 0.3);
    }

    .btn-success {
      background: var(--color-success);
      color: var(--color-text-inverse);
    }

    .btn-success:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(46, 125, 79, 0.3);
    }

    .btn-danger {
      background: var(--color-danger);
      color: var(--color-text-inverse);
    }

    .btn-danger:hover {
      background: var(--color-accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(217, 79, 48, 0.3);
    }

    .btn:disabled {
      background: var(--admin-border);
      color: var(--color-text-secondary);
      cursor: not-allowed;
      transform: none;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-secondary);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .map-placeholder {
      height: 250px;
      background: var(--admin-content-bg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      font-size: 13px;
    }

    /* Статистика */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      background: var(--admin-card-bg);
      border-bottom: 1px solid var(--admin-border);
    }

    .stat-card {
      text-align: center;
      padding: 10px 8px;
      background: var(--admin-content-bg);
      border-radius: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-card.new .stat-value { color: var(--color-info); }
    .stat-card.active .stat-value { color: var(--color-primary); }
    .stat-card.completed .stat-value { color: var(--color-success); }
    .stat-card.cancelled .stat-value { color: var(--color-danger); }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--admin-content-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--color-grey-4);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Левая панель -->
    <div class="deliveries-list">
      <div class="header">
        <h1>Управление Доставками</h1>
        <div class="subtitle" id="currentTime">Загрузка...</div>
      </div>

      <!-- Статистика -->
      <div class="stats">
        <div class="stat-card new">
          <div class="stat-value" id="stat-new">0</div>
          <div class="stat-label">Новые</div>
        </div>
        <div class="stat-card active">
          <div class="stat-value" id="stat-active">0</div>
          <div class="stat-label">В пути</div>
        </div>
        <div class="stat-card completed">
          <div class="stat-value" id="stat-completed">0</div>
          <div class="stat-label">Доставлено</div>
        </div>
        <div class="stat-card cancelled">
          <div class="stat-value" id="stat-cancelled">0</div>
          <div class="stat-label">Отменено</div>
        </div>
      </div>

      <!-- Фильтры -->
      <div class="filters">
        <div class="filter-tabs">
          <div class="filter-tab active" data-filter="all">Все</div>
          <div class="filter-tab" data-filter="new">Новые</div>
          <div class="filter-tab" data-filter="active">Активные</div>
        </div>
        <input type="text" class="search-box" placeholder="Поиск по адресу или заказу..." id="searchBox">
      </div>

      <!-- Список доставок -->
      <div class="delivery-items" id="deliveryList">
        <div class="empty-state">
          <div class="empty-state-icon">📦</div>
          <div>Загрузка доставок...</div>
        </div>
      </div>
    </div>

    <!-- Правая панель -->
    <div class="delivery-details">
      <div id="detailsView" class="empty-state" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div>
          <div class="empty-state-icon">🚚</div>
          <div>Выберите доставку для просмотра деталей</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Состояние приложения
    let deliveries = [];
    let selectedDelivery = null;
    let currentFilter = 'all';

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
      updateTime();
      setInterval(updateTime, 1000);
      setupEventListeners();
      loadDeliveries();
      setInterval(loadDeliveries, 5000); // Обновление каждые 5 секунд
    });

    function updateTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('currentTime').textContent = `${timeStr} • ${dateStr}`;
    }

    function setupEventListeners() {
      // Фильтры
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.dataset.filter;
          renderDeliveries();
        });
      });

      // Поиск
      document.getElementById('searchBox').addEventListener('input', (e) => {
        renderDeliveries(e.target.value);
      });
    }

    async function loadDeliveries() {
      try {
        // Генерация тестовых данных (заменить на реальный API)
        deliveries = generateMockDeliveries();
        renderDeliveries();
        updateStats();
      } catch (error) {
        console.error('Ошибка загрузки доставок:', error);
      }
    }

    function generateMockDeliveries() {
      const statuses = ['new', 'assigned', 'in_transit', 'delivered', 'cancelled'];
      const addresses = [
        'ул. Пушкина, д. 25, кв. 12',
        'пр. Ленина, д. 45, кв. 7',
        'ул. Гагарина, д. 18, подъезд 2',
        'ул. Советская, д. 32, кв. 55',
        'ул. Мира, д. 10, офис 301'
      ];
      const customers = ['Иван Петров', 'Мария Сидорова', 'Алексей Козлов', 'Елена Иванова', 'Дмитрий Смирнов'];

      return Array.from({ length: 15 }, (_, i) => ({
        id: `D-${1000 + i}`,
        orderId: `ORD-${2000 + i}`,
        status: statuses[Math.floor(Math.random() * statuses.length)],
        address: addresses[Math.floor(Math.random() * addresses.length)],
        customer: customers[Math.floor(Math.random() * customers.length)],
        phone: '+7 (999) 123-45-67',
        deliveryTime: new Date(Date.now() + Math.random() * 3600000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
        courier: i % 3 === 0 ? null : `Курьер ${Math.floor(Math.random() * 5) + 1}`,
        total: Math.floor(Math.random() * 3000) + 500,
        items: [
          { name: 'Пицца Маргарита', quantity: 1, price: 450 },
          { name: 'Coca-Cola 0.5л', quantity: 2, price: 120 }
        ],
        createdAt: new Date(Date.now() - Math.random() * 7200000)
      }));
    }

    function renderDeliveries(searchTerm = '') {
      const listEl = document.getElementById('deliveryList');
      let filtered = deliveries;

      // Фильтр по статусу
      if (currentFilter !== 'all') {
        if (currentFilter === 'new') {
          filtered = filtered.filter(d => d.status === 'new');
        } else if (currentFilter === 'active') {
          filtered = filtered.filter(d => ['assigned', 'in_transit'].includes(d.status));
        }
      }

      // Поиск
      if (searchTerm) {
        filtered = filtered.filter(d =>
          d.address.toLowerCase().includes(searchTerm.toLowerCase()) ||
          d.orderId.toLowerCase().includes(searchTerm.toLowerCase()) ||
          d.customer.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }

      // Сортировка по времени создания
      filtered.sort((a, b) => b.createdAt - a.createdAt);

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <div>Доставки не найдены</div>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(delivery => `
        <div class="delivery-card ${delivery.status} ${selectedDelivery?.id === delivery.id ? 'selected' : ''}"
             onclick="selectDelivery('${delivery.id}')">
          <div class="delivery-header">
            <span class="delivery-id">${delivery.orderId}</span>
            <span class="delivery-time">${delivery.deliveryTime}</span>
          </div>
          <span class="delivery-status status-${delivery.status}">${getStatusName(delivery.status)}</span>
          <div class="delivery-address">
            📍 ${delivery.address}
          </div>
          <div class="delivery-customer">
            👤 ${delivery.customer}
          </div>
        </div>
      `).join('');
    }

    function selectDelivery(id) {
      selectedDelivery = deliveries.find(d => d.id === id);
      renderDeliveries();
      renderDetails();
    }

    function renderDetails() {
      if (!selectedDelivery) return;

      const d = selectedDelivery;
      const detailsView = document.getElementById('detailsView');
      // Заглушка «Выберите доставку» центрирована строкой; карточке деталей нужна колонка
      detailsView.className = '';
      detailsView.style.cssText = 'flex: 1; display: flex; flex-direction: column; overflow: hidden;';

      const statusSteps = [
        { key: 'new', label: 'Создан', icon: '📋' },
        { key: 'assigned', label: 'Назначен', icon: '👤' },
        { key: 'in_transit', label: 'В пути', icon: '🚚' },
        { key: 'delivered', label: 'Доставлен', icon: '✅' }
      ];

      const currentStepIndex = statusSteps.findIndex(s => s.key === d.status);

      detailsView.innerHTML = `
        <div class="details-header">
          <div class="details-title">Заказ ${d.orderId}</div>
        </div>

        <div class="status-timeline">
          ${statusSteps.map((step, index) => `
            <div class="timeline-step ${index < currentStepIndex ? 'completed' : ''} ${index === currentStepIndex ? 'active' : ''}">
              <div class="timeline-icon">${step.icon}</div>
              <div class="timeline-label">${step.label}</div>
            </div>
          `).join('')}
        </div>

        <div class="details-content">
          <div class="section">
            <div class="section-title">📍 Информация о доставке</div>
            <div class="info-row">
              <span class="info-label">Адрес</span>
              <span class="info-value">${d.address}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Время доставки</span>
              <span class="info-value">${d.deliveryTime}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Курьер</span>
              <span class="info-value">${d.courier || 'Не назначен'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Статус</span>
              <span class="info-value">
                <span class="delivery-status status-${d.status}">${getStatusName(d.status)}</span>
              </span>
            </div>
          </div>

          <div class="section">
            <div class="section-title">👤 Клиент</div>
            <div class="info-row">
              <span class="info-label">Имя</span>
              <span class="info-value">${d.customer}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Телефон</span>
              <span class="info-value">${d.phone}</span>
            </div>
          </div>

          <div class="section">
            <div class="section-title">🛒 Состав заказа</div>
            <div class="order-items">
              ${d.items.map(item => `
                <div class="order-item">
                  <div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-quantity">× ${item.quantity}</div>
                  </div>
                  <div class="item-price">${item.price} ₽</div>
                </div>
              `).join('')}
            </div>
            <div class="info-row" style="margin-top: 15px; padding-top: 15px; border-top: 2px solid var(--admin-border);">
              <span class="info-label" style="font-weight: 600;">Итого</span>
              <span class="info-value" style="font-size: 18px; color: var(--color-primary);">${d.total} ₽</span>
            </div>
          </div>

          <div class="section">
            <div class="section-title">🗺️ Карта</div>
            <div class="map-placeholder">
              Карта доставки (интеграция с картами)
            </div>
          </div>
        </div>

        <div class="actions">
          ${d.status === 'new' ? `
            <button class="btn btn-primary" onclick="assignDelivery()">
              👤 Назначить курьера
            </button>
          ` : ''}
          ${d.status === 'assigned' ? `
            <button class="btn btn-primary" onclick="startDelivery()">
              🚚 Начать доставку
            </button>
          ` : ''}
          ${d.status === 'in_transit' ? `
            <button class="btn btn-success" onclick="completeDelivery()">
              ✅ Завершить доставку
            </button>
          ` : ''}
          ${['new', 'assigned'].includes(d.status) ? `
            <button class="btn btn-danger" onclick="cancelDelivery()">
              ❌ Отменить
            </button>
          ` : ''}
        </div>
      `;
    }

    function getStatusName(status) {
      const names = {
        new: 'Новый',
        assigned: 'Назначен',
        in_transit: 'В пути',
        delivered: 'Доставлен',
        cancelled: 'Отменен'
      };
      return names[status] || status;
    }

    function updateStats() {
      document.getElementById('stat-new').textContent =
        deliveries.filter(d => d.status === 'new').length;
      document.getElementById('stat-active').textContent =
        deliveries.filter(d => ['assigned', 'in_transit'].includes(d.status)).length;
      document.getElementById('stat-completed').textContent =
        deliveries.filter(d => d.status === 'delivered').length;
      document.getElementById('stat-cancelled').textContent =
        deliveries.filter(d => d.status === 'cancelled').length;
    }

    // Действия с доставкой
    function assignDelivery() {
      if (!selectedDelivery) return;
      selectedDelivery.status = 'assigned';
      selectedDelivery.courier = `Курьер ${Math.floor(Math.random() * 5) + 1}`;
      renderDeliveries();
      renderDetails();
      updateStats();
      showNotification('Курьер назначен на доставку');
    }

    function startDelivery() {
      if (!selectedDelivery) return;
      selectedDelivery.status = 'in_transit';
      renderDeliveries();
      renderDetails();
      updateStats();
      showNotification('Доставка началась');
    }

    function completeDelivery() {
      if (!selectedDelivery) return;
      selectedDelivery.status = 'delivered';
      renderDeliveries();
      renderDetails();
      updateStats();
      showNotification('Доставка завершена успешно!');
    }

    function cancelDelivery() {
      if (!selectedDelivery) return;
      if (confirm('Вы уверены, что хотите отменить эту доставку?')) {
        selectedDelivery.status = 'cancelled';
        renderDeliveries();
        renderDetails();
        updateStats();
        showNotification('Доставка отменена');
      }
    }

    function showNotification(message) {
      // Простое уведомление (можно заменить на toast notification)
      alert(message);
    }
  </script>
</body>
</html>
