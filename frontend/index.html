<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/manifest.json?v=2">
    <meta name="theme-color" content="#2E7D4F">
    <title>FoodFlow</title>
    <script src="/js/auth.js"></script>
    <script>
        // Точка входа: залогиненного ведём сразу в админ-панель,
        // остальных — на приветствие и вход в организацию.
        (function () {
            var dest = '/admin-panel/login.html';
            try {
                if (AUTH.isLoggedIn()) {
                    var role = AUTH.getRole();
                    dest = role === 'super_admin' ? '/admin-panel/super-admin.html'
                         : role === 'cashier'     ? '/admin-panel/pos.html'
                         : '/admin-panel/dashboard.html';
                }
            } catch (e) { /* нет/битая сессия — на вход */ }
            window.location.replace(dest);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/admin-panel/login.html"></noscript>
</head>
<body>
    <p>Переход в <a href="/admin-panel/login.html">FoodFlow</a>…</p>
</body>
</html>
